openapi: 3.0.3

info:
  title: Home Library Service API
  version: 1.0.0
  description: Home Library Service built with NestJS

servers:
  - url: http://localhost:4000
    description: Local server

# 🔐 ГЛОБАЛЬНАЯ АВТОРИЗАЦИЯ (ВСЁ ПОД ЗАМКОМ)
security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      summary: Signup
      tags: [Auth]
      security: []   # 👈 публичный
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsDto'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid body
        '403':
          description: User already exists

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []   # 👈 публичный
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsDto'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '403':
          description: Wrong credentials

  /user:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /user/{id}:
    get:
      summary: Get user by id
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update user password
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDto'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '204':
          description: Deleted

  /artist:
    get:
      summary: Get all artists
      tags: [Artists]
      responses:
        '200':
          description: OK
    post:
      summary: Create artist
      tags: [Artists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtistDto'
      responses:
        '201':
          description: Created

  /artist/{id}:
    get:
      summary: Get artist by id
      tags: [Artists]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: OK
    put:
      summary: Update artist
      tags: [Artists]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete artist
      tags: [Artists]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '204':
          description: Deleted

  /album:
    get:
      summary: Get all albums
      tags: [Albums]
      responses:
        '200':
          description: OK
    post:
      summary: Create album
      tags: [Albums]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlbumDto'
      responses:
        '201':
          description: Created

  /album/{id}:
    get:
      summary: Get album by id
      tags: [Albums]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: OK
    put:
      summary: Update album
      tags: [Albums]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete album
      tags: [Albums]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '204':
          description: Deleted

  /track:
    get:
      summary: Get all tracks
      tags: [Tracks]
      responses:
        '200':
          description: OK
    post:
      summary: Create track
      tags: [Tracks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackDto'
      responses:
        '201':
          description: Created

  /track/{id}:
    get:
      summary: Get track by id
      tags: [Tracks]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: OK
    put:
      summary: Update track
      tags: [Tracks]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete track
      tags: [Tracks]
      parameters:
        - $ref: '#/components/parameters/UuidParam'
      responses:
        '204':
          description: Deleted

  /favs:
    get:
      summary: Get all favorites
      tags: [Favorites]
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UuidParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AuthCredentialsDto:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    AuthTokensResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    CreateUserDto:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    UpdatePasswordDto:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        version:
          type: number
        createdAt:
          type: number
        updatedAt:
          type: number

    CreateArtistDto:
      type: object
      required: [name, grammy]
      properties:
        name:
          type: string
        grammy:
          type: boolean

    CreateAlbumDto:
      type: object
      required: [name, year]
      properties:
        name:
          type: string
        year:
          type: number
        artistId:
          type: string
          nullable: true

    CreateTrackDto:
      type: object
      required: [name, duration]
      properties:
        name:
          type: string
        duration:
          type: number
        artistId:
          type: string
          nullable: true
        albumId:
          type: string
          nullable: true